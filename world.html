<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kuyulu 3D – Geländeansicht</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#0a0d14;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:#dde1e8;user-select:none}
  canvas{display:block}
  #bar{position:fixed;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;background:linear-gradient(#0a0d14e6,#0a0d1400);z-index:5}
  #bar button{font:13px "Segoe UI",system-ui,sans-serif;color:#dde1e8;background:#141b27cc;border:1px solid #324056;padding:6px 10px;cursor:pointer;border-radius:3px}
  #bar button:hover{border-color:#e0894a;color:#e0894a}
  #bar button.on{border-color:#e0894a;color:#e0894a}
  #bar .sep{width:12px}
  #help{position:fixed;left:10px;bottom:10px;font-size:13px;line-height:1.5;background:#0a0d14c0;padding:8px 12px;border:1px solid #263142;max-width:520px;z-index:5}
  #help b{color:#e0894a;font-weight:600}
  #info{position:fixed;right:10px;bottom:10px;font:12px Consolas,monospace;background:#0a0d14c0;padding:6px 10px;border:1px solid #263142;z-index:5;text-align:right}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0d14;z-index:20;font-size:16px;letter-spacing:.1em}
  .lbl{position:fixed;left:0;top:0;transform:translate(-50%,-100%);font-size:12px;white-space:nowrap;text-shadow:0 0 3px #000,0 0 5px #000;pointer-events:none;z-index:3;color:#f2e6d6}
  .lbl.free{color:#e0894a}
  .lbl.miss{color:#e8786a}
  #err{position:fixed;left:10px;top:60px;color:#f88;font-size:13px;white-space:pre-wrap;z-index:30}
</style>

{"imports":{"three":"./lib/three/three.module.js","three/addons/":"./lib/three/addons/"}}
</script>
</head>
<body>
<div id="load">Kuyulu wird aufgebaut …</div>
<div id="bar">
  <button data-view="dorf">Dorf nah (Süd)</button>
  <button data-view="sued">Überblick (Tal)</button>
  <button data-view="oben">Von oben</button>
  <button data-view="ost">Zufahrt durch den Pass</button>
  <button data-view="west">Friedhofshang</button>

  <button data-walk="platz">Dorfplatz</button>
  <button data-walk="haus_oma">Haus der Großmutter</button>

  <button data-walk="muehle">Mühle</button>
  <span class="sep"></span>
  <button id="btnWalk" style="font-weight:bold">Hier herumlaufen (G)</button>
  <span class="sep"></span>
  <button data-light="daemmerung" class="on">Dämmerung</button>
  <button data-light="tag">Tag</button>
  <button data-light="nacht">Nacht</button>

</div>
<div id="help"></div>
<div id="info"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { FtfLook } from './lib/ftf_look.js';

const $ = id => document.getElementById(id);
addEventListener('error', e => { $('err').textContent = 'Fehler: ' + e.message; });
addEventListener('unhandledrejection', e => { $('err').textContent = 'Fehler: ' + (e.reason && e.reason.message || e.reason); });

const MAP = await (await fetch('map/kuyulu_map.json')).json();
const texLoader = new THREE.TextureLoader();
const loadT = (n, srgb) => new Promise(res => texLoader.load('assets/textures/' + n, tx => { tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.anisotropy = 4; if (srgb) tx.colorSpace = THREE.SRGBColorSpace; res(tx); }, undefined, () => res(null)));
const TX = {};
await Promise.all(['old_stone_wall', 'rustic_stone_wall', 'rough_plaster_broken', 'brown_mud_dry', 'worn_corrugated_iron', 'weathered_planks'].flatMap(n => [
  loadT(n + '_diff.jpg', true).then(v => TX[n] = v), loadT(n + '_nor.jpg', false).then(v => TX[n + '_n'] = v)]).concat([
  loadT('ground_detail.jpg', true).then(v => TX.ground = v), loadT('ground_nor.jpg', false).then(v => TX.ground_n = v)]));
const P = Object.fromEntries(MAP.places.map(p => [p.id, p]));

/* ------------------------------------------------------------ Hilfsfunktionen */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
function hash(i, j) { let h = Math.imul(i, 374761393) ^ Math.imul(j, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y) { return vnoise(x, y) * .55 + vnoise(x * 2.1, y * 2.1) * .3 + vnoise(x * 4.3, y * 4.3) * .15; }
function dseg(px, py, a, b) { const dx = b[0] - a[0], dy = b[1] - a[1], l = dx * dx + dy * dy; const t = l ? clamp(((px - a[0]) * dx + (py - a[1]) * dy) / l, 0, 1) : 0; return Math.hypot(px - (a[0] + t * dx), py - (a[1] + t * dy)); }
function dpoly(px, py, L) { let m = 1e9; for (let i = 0; i < L.length - 1; i++) m = Math.min(m, dseg(px, py, L[i], L[i + 1])); return m; }

/* ------------------------------------------------------------------ Gelände */
const MIN = -500, MAX = 1500;
// Bergkranz-Anteil 0..1 (0 = Talboden, 1 = Kamm). Jede Seite hat eine eigene Hanglänge (Abstand vom Rand bis zum Talfuß).
function ringT(x, z) {
  const n = Math.min((x - MIN) / 600, (MAX - x) / 680, (z - MIN) / 830, (MAX - z) / 620);
  return smooth(1, 0.04, n);
}
function baseH(x, z) {
  // Talboden mit Dorfterrasse: Fluss im Süden (0 m), sanft ansteigend bis ca. 40 m im Norden des Dorfes
  let h = smooth(860, 560, z) * 22 + smooth(560, 380, z) * 18;
  const t = ringT(x, z);
  const dRoad = dpoly(x, z, MAP.road), dRiv = dpoly(x, z, MAP.river);
  // Pass für die Straße und Schlucht für den Fluss: dort bleibt der Kranz niedrig
  const gap = Math.min(lerp(0.25, 1, smooth(30, 330, dRoad)), lerp(0.3, 1, smooth(30, 380, dRiv)));
  const Hm = 210 + 130 * fbm(x / 260 + 5, z / 260 + 9);
  const rid = 1 - Math.abs(fbm(x / 90 + 3, z / 90) - 0.5) * 2;
  h += (Hm * Math.pow(t, 1.1) + (rid * rid * 30 + (fbm(x / 45, z / 45) - 0.5) * 16 + Math.pow(1 - Math.abs(fbm(x / 24 + 7, z / 24 + 2) - 0.5) * 2, 2) * 9 + (fbm(x / 11, z / 11 + 5) - 0.5) * 3.5) * t * t) * gap;
  // leichtes Relief im Talboden
  h += (fbm(x / 90, z / 90) - 0.5) * 2 * (1.5 + 3 * (1 - t));
  h += 10 * Math.exp(-((x - 60) ** 2 + (z - 540) ** 2) / (2 * 70 * 70)) * (1 - t);
  if (dRiv < 22) h = lerp(h, Math.min(h, -2.5), 1 - smooth(9, 22, dRiv));
  return h;
}
let snowUpdate = () => { }, skyUpdate = () => { };
let laneLift = () => 0;   // Höhe des Gassen-Reliefs über dem Gelände (wird bei der Dekoration gesetzt)
const pads = [];
function addPad(x, z, r) { pads.push({ x, z, r, h: baseH(x, z) }); }
function heightAt(x, z) {
  let h = baseH(x, z);
  for (const p of pads) { const d = Math.hypot(x - p.x, z - p.z); if (d < p.r + 7) h = lerp(h, p.h, 1 - smooth(p.r, p.r + 7, d)); }
  return h;
}

/* ------------------------------------------------------------ Szene, Licht */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const look = new FtfLook(renderer, { height: 720 });
look.enabled = (location.search.indexOf('clean') < 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.3, 8000);
camera.rotation.order = 'YXZ';
const hemi = new THREE.HemisphereLight(0xaab4d0, 0x2a2a30, 0.8);
const sun = new THREE.DirectionalLight(0xffa060, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;
scene.add(hemi, sun, sun.target);
const LIGHTS = {
  daemmerung: { bg: 0x353b58, fog: 0.00055, fogWalk: 0.014, hemi: 1.15, hemiSky: 0xb4bedc, sun: 0xffb682, sunI: 1.5, dir: [-0.9, 0.3, 0.25] },
  tag:        { bg: 0x9db6d2, fog: 0.0002,  fogWalk: 0.0012, hemi: 1.1,  hemiSky: 0xdfe9f5, sun: 0xfff2dd, sunI: 2.6, dir: [-0.4, 0.8, 0.35] },
  nacht:      { bg: 0x05070c, fog: 0.0011,  fogWalk: 0.026, hemi: 0.4, hemiSky: 0x5a6e9c, sun: 0x93a9dc, sunI: 0.8, hemiWalk: 0.085, sunWalk: 0.13, dir: [0.5, 0.6, -0.4] }
};
let lightName = 'daemmerung';
scene.background = new THREE.Color(LIGHTS.daemmerung.bg);
scene.fog = new THREE.FogExp2(LIGHTS.daemmerung.bg, LIGHTS.daemmerung.fog);

/* Terrain-Mesh */
const N = 400, SIZE = 2000;
// Pads vorab festlegen: Story-Gebäude, Häuser, Platz
const FOOT = { 'House_1': [6.0, 7.4], 'House_2': [6.2, 9.6], 'House_3': [5.4, 5.9], 'House_4': [5.4, 5.9], 'Inn': [11.3, 11.3], 'Mill': [9.5, 7.6], 'Stable': [13.2, 9.3], 'Blacksmith': [10.9, 9.2], 'Sawmill': [12.3, 9.2] };
const fpOf = m => FOOT[(m || '').split('/').pop().replace('.glb', '')];
// Wohnhaus-Varianten (Ostanatolien: grober Stein oder Lehmputz, meist Flachdach aus Erde, teils rostiges Blech)
const VARIANTS = [
  { w: 7.2, d: 5.8, h: 3.0, wall: 'stone', roof: 'earth', chimney: true, tezek: true },
  { w: 6.4, d: 5.4, h: 2.9, wall: 'plaster', roof: 'earth', tezek: true },
  { w: 8.0, d: 6.2, h: 3.0, wall: 'stone2', roof: 'tin', chimney: true },
  { w: 6.6, d: 5.6, h: 2.8, wall: 'stone', roof: 'earth', annex: true, chimney: true },
  { w: 6.0, d: 5.6, h: 2.9, wall: 'plaster', roof: 'earth', stories: 2 },
  { w: 7.0, d: 6.0, h: 3.0, wall: 'stone2', roof: 'earth', damage: 0.8 },
  { w: 6.8, d: 5.8, h: 2.9, wall: 'stone', roof: 'tin', damage: 0.7 },
  { w: 5.8, d: 5.0, h: 2.7, wall: 'plaster', roof: 'tin', tezek: true }
];
const vDims = v => [v.w + (v.annex ? 3.9 : 0), v.d];
const STORY_DIMS = { haus_oma: [11, 9], stall: [15, 8], gasthaus: [13, 11], schmiede: [11, 9], saegewerk: [12, 9], muehle: [12, 9.5], haus1: [7.4, 6], haus2: [7.4, 6], haus3: [7.4, 6] };
const PLACEHOLDER = { hamam: [30, 16, 6.5], archiv: [20, 20, 7], unterstand: [5, 4, 3], huette1: [5.5, 4.5, 3.2], huette2: [5.5, 4.5, 3.2], huette3: [5.5, 4.5, 3.2], ruine: [10, 8, 3.5], hoehle: [9, 6, 5] };
const storyB = MAP.places.filter(p => p.type === 'building' && !p.id.startsWith('wh'));
storyB.forEach(p => { const f = fpOf(p.model); const dims = STORY_DIMS[p.id] || (f ? [f[0], f[1]] : PLACEHOLDER[p.id]); p._d = [dims[0], dims[1], 0]; addPad(p.x, p.y, Math.max(dims[0], dims[1]) * 0.62 + 1); });
MAP.houses.forEach((h, i) => { h._v = VARIANTS[Math.floor(hash(i, 77) * VARIANTS.length)]; const dm = vDims(h._v); addPad(h.x, h.z, Math.max(dm[0], dm[1]) * 0.62 + 1.5); });
addPad(480, 510, 28);
[['brunnen2', 4], ['brunnen3', 4], ['quelle', 5]].forEach(([id, r]) => addPad(P[id].x, P[id].y, r));

const geo = new THREE.PlaneGeometry(SIZE, SIZE, N, N);
geo.rotateX(-Math.PI / 2);
geo.translate(MIN + SIZE / 2, 0, MIN + SIZE / 2);
{
  const pos = geo.attributes.position, n = pos.count;
  for (let i = 0; i < n; i++) pos.setY(i, heightAt(pos.getX(i), pos.getZ(i)));
  geo.computeVertexNormals();
}
/* Bodenfarbe als eigene Textur (ca. 1 m pro Bildpunkt, weich gefiltert) statt grober Farbflächen pro Gitterpunkt:
   Schnee, gefrorene Erde, Geröll, Fels, dazu die Gassen, die Straße, der Dorfplatz und das Eis am Fluss. */
const GW = 2048, groundCanvas = document.createElement('canvas'); groundCanvas.width = groundCanvas.height = GW;
const groundTex = new THREE.CanvasTexture(groundCanvas); groundTex.colorSpace = THREE.SRGBColorSpace; groundTex.anisotropy = 8; groundTex.generateMipmaps = true;
const LANESEG = []; for (const L of MAP.lanes) for (let i = 0; i < L.length - 1; i++) LANESEG.push([L[i], L[i + 1]]);
const bboxOf = (pts, m) => [Math.min(...pts.map(p => p[0])) - m, Math.min(...pts.map(p => p[1])) - m, Math.max(...pts.map(p => p[0])) + m, Math.max(...pts.map(p => p[1])) + m];
const LB = bboxOf(MAP.lanes.flat(), 8), RB = bboxOf(MAP.road, 12), VB = bboxOf(MAP.river, 16);
const inB = (x, z, B) => x > B[0] && x < B[2] && z > B[1] && z < B[3];
const toS = v => Math.round(255 * Math.pow(clamp(v, 0, 1), 1 / 2.2));
let snowAmt = 0.7;
function paintTerrain() {
  const pos = geo.attributes.position, nor = geo.attributes.normal, g2 = groundCanvas.getContext('2d'), img = g2.createImageData(GW, GW), D = img.data, V = N + 1;
  const snow = [0.86, 0.88, 0.93], soilWet = [0.30, 0.24, 0.18], dust = [0.47, 0.41, 0.31], gravel = [0.41, 0.40, 0.38], rockC = [0.38, 0.35, 0.32];
  const path = [0.19, 0.145, 0.10], road = [0.30, 0.275, 0.24], plaza = [0.36, 0.32, 0.27], ice = [0.55, 0.72, 0.86], rut = [0.17, 0.135, 0.105];
  const c = [0, 0, 0], mix = (to, t) => { c[0] += (to[0] - c[0]) * t; c[1] += (to[1] - c[1]) * t; c[2] += (to[2] - c[2]) * t; };
  for (let py = 0; py < GW; py++) {
    const z = MIN + (py + 0.5) / GW * SIZE, gz = clamp((z - MIN) / SIZE * N, 0, N - 0.001), iz = Math.floor(gz), fz = gz - iz;
    for (let px = 0; px < GW; px++) {
      const x = MIN + (px + 0.5) / GW * SIZE, gx = clamp((x - MIN) / SIZE * N, 0, N - 0.001), ix = Math.floor(gx), fx = gx - ix;
      const i00 = iz * V + ix, i10 = i00 + 1, i01 = i00 + V, i11 = i01 + 1, w00 = (1 - fx) * (1 - fz), w10 = fx * (1 - fz), w01 = (1 - fx) * fz, w11 = fx * fz;
      const y = pos.getY(i00) * w00 + pos.getY(i10) * w10 + pos.getY(i01) * w01 + pos.getY(i11) * w11;
      const ny = nor.getY(i00) * w00 + nor.getY(i10) * w10 + nor.getY(i01) * w01 + nor.getY(i11) * w11;
      const n1 = fbm(x / 26, z / 26), n2 = fbm(x / 9 + 40, z / 9), n3 = vnoise(x / 2.3 + 7, z / 2.3);
      // Boden ohne Schnee: gefrorene Erde, trockenes Gras/Staub, Geröll; steil = Fels
      c[0] = soilWet[0]; c[1] = soilWet[1]; c[2] = soilWet[2];
      mix(dust, smooth(0.35, 0.65, n2)); mix(gravel, smooth(0.62, 0.8, n1 * 0.6 + n2 * 0.4)); mix(rockC, smooth(0.93, 0.7, ny)); { const st = smooth(0.9, 0.68, ny); if (st > 0) { const bnd = 0.5 + 0.5 * Math.sin(y * 0.55 + n2 * 5 + n1 * 3); mix([0.22, 0.205, 0.2], st * 0.5 * bnd); mix([0.5, 0.47, 0.43], st * 0.28 * (1 - bnd)); } }
      // Schneeanteil: mehr in der Höhe und in Mulden, weniger an steilen Flanken, auf Wegen und im Dorfkern; der Rand ist unregelmäßig
      const score = (snowAmt - 0.5) * 2.6 + (n1 - 0.5) * (snowAmt > 0.6 ? 0.5 : 1.5) + 0.7 * smooth(20, 190, y) - 0.55 * smooth(0.9, 0.7, ny) + (n3 - 0.5) * 0.12;
      let cover = smooth(-0.15, 0.3, score + 0.22);
      if (inB(x, z, LB)) { let dl = 1e9; for (const s of LANESEG) { const d = dseg(x, z, s[0], s[1]); if (d < dl) dl = d; }
        cover = Math.max(cover, smooth(12, 7.5, dl));   // geräumter Schnee liegt als heller Rand neben der Gasse
        const wl = smooth(3.6, 2.4, dl + (n3 - 0.5) * 1.1); if (wl > 0) { mix(path, wl); cover *= 1 - wl; const rr = Math.abs(dl - 0.85); if (rr < 0.45) mix(rut, 0.5 * wl * (1 - rr / 0.45)); } }
      if (inB(x, z, RB)) { const dro = dpoly(x, z, MAP.road); cover = Math.max(cover, smooth(15, 10, dro)); const wr = smooth(5.2, 3.8, dro + (n3 - 0.5) * 0.9); if (wr > 0) { mix(road, wr); cover *= 1 - wr * 0.95; const rr = Math.abs(dro - 1.25); if (rr < 0.5) mix(rut, 0.45 * wr * (1 - rr / 0.5)); } }
      const dp = Math.hypot(x - 480, z - 510); if (dp < 30) { const wp = smooth(28, 20, dp + (n3 - 0.5) * 3); mix(plaza, wp); cover *= 1 - wp * 0.9; }
      { const dr = 0.06 * (n2 - 0.5) + 0.05 * (n1 - 0.5); mix([snow[0] - 0.05 + dr, snow[1] - 0.035 + dr, snow[2] + dr * 0.6], cover); }   // Schneedecke mit leichten Verwehungen (bläuliche Schatten)
      if (inB(x, z, VB)) { const dr = dpoly(x, z, MAP.river); if (dr < 12) mix(ice, smooth(12, 7, dr)); }
      const k = (py * GW + px) * 4; D[k] = toS(c[0]); D[k + 1] = toS(c[1]); D[k + 2] = toS(c[2]); D[k + 3] = 255;
    }
  }
  g2.putImageData(img, 0, 0); groundTex.needsUpdate = true;
}
paintTerrain();
if (TX.ground) { TX.ground.anisotropy = 8; }
if (TX.ground_n) TX.ground_n.repeat.set(SIZE / 5, SIZE / 5);
const terrainMat = new THREE.MeshStandardMaterial({ map: groundTex, normalMap: TX.ground_n, normalScale: new THREE.Vector2(0.55, 0.55), roughness: 0.95, metalness: 0 });
if (TX.ground) terrainMat.onBeforeCompile = sh => {   // feine Körnung aus der Detail-Textur über die Farbkarte legen (zwei Größen gegen sichtbare Kacheln)
  sh.uniforms.detailMap = { value: TX.ground };
  sh.fragmentShader = sh.fragmentShader.replace('#include <map_pars_fragment>', '#include <map_pars_fragment>\nuniform sampler2D detailMap;')
    .replace('#include <map_fragment>', '#include <map_fragment>\n  { vec3 d1 = texture2D(detailMap, vMapUv * 500.0).rgb, d2 = texture2D(detailMap, vMapUv * 61.0).rgb; float sn = 1.0 - 0.85 * smoothstep(0.35, 0.62, dot(diffuseColor.rgb, vec3(0.333))); diffuseColor.rgb *= mix(vec3(1.0), d1 * 1.27, 0.75 * sn) * mix(vec3(1.0), d2 * 1.27, 0.35 * sn); }');
};
const terrain = new THREE.Mesh(geo, terrainMat);
terrain.receiveShadow = true;
scene.add(terrain);
// Kartenrand: Wand nach unten, damit die Kante sauber aussieht
{
  const skirt = new THREE.Mesh(new THREE.BoxGeometry(SIZE * 1.2, 1, SIZE * 1.2), new THREE.MeshBasicMaterial({ color: 0x05070b }));
  skirt.position.set(MIN + SIZE / 2, -60, MIN + SIZE / 2); scene.add(skirt);
}

/* ------------------------------------------------------------------- Modelle */
const loader = new GLTFLoader();
const cache = {};
const colliders = [];
async function model(path) { if (!cache[path]) cache[path] = loader.loadAsync('assets/models/' + path).then(g => g.scene); return (await cache[path]).clone(true); }
function shadowAll(o) { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); }
/* ---------- Materialien: echte Texturen (Poly Haven, CC0), Kachelgröße 2,6 m ---------- */
const TILE = 2.6;
const mkTex = (n, tint, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ map: TX[n], normalMap: TX[n + '_n'], normalScale: new THREE.Vector2(1, 1), color: tint, roughness: 1, metalness: 0 }, o));
const MATS = {

  document.querySelectorAll('[data-light]').forEach(b => b.classList.toggle('on', b.dataset.light === name));
  skyUpdate(name);
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
document.querySelectorAll('[data-walk]').forEach(b => b.onclick = () => walkTo(b.dataset.walk));
document.querySelectorAll('[data-light]').forEach(b => b.onclick = () => setLight(b.dataset.light));
$('btnLook').onclick = e => { look.enabled = !look.enabled; e.target.classList.toggle('on', look.enabled); };
$('btnSnow').onclick = e => { const steps = [[0.7, 'viel'], [0.42, 'mittel'], [0.2, 'wenig']]; const i = (steps.findIndex(s => s[0] === snowAmt) + 1) % steps.length; snowAmt = steps[i][0]; e.target.textContent = 'Schnee: ' + steps[i][1]; paintTerrain(); };
$('btnLabels').onclick = e => { labelsOn = !labelsOn; e.target.classList.toggle('on', labelsOn); };

addEventListener('keydown', e => { keys.add(e.code); if (e.code === 'KeyG' && !e.repeat) toggleWalk(); });
// Umschalten zwischen Fliegen und Gehen an der Stelle, an der man gerade ist
function toggleWalk() {
  if (mode === 'walk') { setMode('fly'); cam.pos.y += 30; cam.pitch = -0.45; }
  else { const x = clamp(cam.pos.x, MIN + 10, MAX - 10), z = clamp(cam.pos.z, MIN + 10, MAX - 10); setMode('walk'); cam.pos.set(x, heightAt(x, z) + 1.65, z); cam.pitch = 0; try { const r = renderer.domElement.requestPointerLock(); if (r && r.catch) r.catch(() => { }); } catch (e) { } }
  $('btnWalk').textContent = mode === 'walk' ? 'Wieder fliegen (G)' : 'Hier herumlaufen (G)';
}
$('btnWalk').onclick = toggleWalk;
addEventListener('keyup', e => keys.delete(e.code));
renderer.domElement.addEventListener('mousedown', e => { dragging = true; if (mode === 'walk' && !document.pointerLockElement) renderer.domElement.requestPointerLock && renderer.domElement.requestPointerLock(); });
addEventListener('mouseup', () => dragging = false);
document.addEventListener('pointerlockchange', () => locked = document.pointerLockElement === renderer.domElement);
addEventListener('mousemove', e => {
  if (!(dragging || locked)) return;
  const k = mode === 'walk' ? 0.0022 : 0.0035;
  cam.yaw -= e.movementX * k; cam.pitch = clamp(cam.pitch - e.movementY * k, -1.5707, 1.5);
});
renderer.domElement.addEventListener('wheel', e => { if (mode !== 'fly') return; e.preventDefault(); const f = new THREE.Vector3(-Math.sin(cam.yaw) * Math.cos(cam.pitch), Math.sin(cam.pitch), -Math.cos(cam.yaw) * Math.cos(cam.pitch)); cam.pos.addScaledVector(f, -e.deltaY * 0.6); }, { passive: false });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); look.resize(); });

/* ------------------------------------------------------------------ Schleife */
let last = performance.now(), shadowT = 0;
function resolveColl(p, r) { for (const c of colliders) { const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz), m = c.r + r; if (d < m && d > 1e-6) { p.x = c.x + dx / d * m; p.z = c.z + dz / d * m; } } }
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const fwd = (keys.has('KeyW') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0), rgt = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);
  const fast = keys.has('ShiftLeft') || keys.has('ShiftRight');
  if (mode === 'walk') {
    const sp = fast ? 8 : 3.6, sn = Math.sin(cam.yaw), cs = Math.cos(cam.yaw);
    let vx = -sn * fwd + cs * rgt, vz = -cs * fwd - sn * rgt; const l = Math.hypot(vx, vz) || 1;
    cam.pos.x = clamp(cam.pos.x + vx / l * sp * dt * (fwd || rgt ? 1 : 0), MIN + 5, MAX - 5); cam.pos.z = clamp(cam.pos.z + vz / l * sp * dt * (fwd || rgt ? 1 : 0), MIN + 5, MAX - 5);
    resolveColl(cam.pos, 0.5);
    const ty = heightAt(cam.pos.x, cam.pos.z) + laneLift(cam.pos.x, cam.pos.z) + 1.65; cam.pos.y += (ty - cam.pos.y) * Math.min(1, dt * 12);
    sun.target.position.set(cam.pos.x, cam.pos.y, cam.pos.z);
  } else {
    const sp = (fast ? 400 : 110), f = new THREE.Vector3(-Math.sin(cam.yaw) * Math.cos(cam.pitch), Math.sin(cam.pitch), -Math.cos(cam.yaw) * Math.cos(cam.pitch)), r = new THREE.Vector3(Math.cos(cam.yaw), 0, -Math.sin(cam.yaw));
    cam.pos.addScaledVector(f, fwd * sp * dt).addScaledVector(r, rgt * sp * dt);
    cam.pos.y += ((keys.has('KeyE') ? 1 : 0) - (keys.has('KeyQ') ? 1 : 0)) * sp * dt;
    cam.pos.y = Math.max(cam.pos.y, heightAt(clamp(cam.pos.x, MIN, MAX), clamp(cam.pos.z, MIN, MAX)) + 3);
    sun.target.position.set(500, 0, 500);
  }
  const L = LIGHTS[lightName]; sun.position.copy(sun.target.position).addScaledVector(new THREE.Vector3(...L.dir).normalize(), 900);
  camera.position.copy(cam.pos); camera.rotation.set(cam.pitch, cam.yaw, 0);
  updatePlumes(now / 1000); snowUpdate(now / 1000);
  for (const w of wheels) w.rotation.x += dt * 0.5;
  look.render(scene, camera);
  // Beschriftungen nur im Flugmodus
  const show = labelsOn && mode === 'fly';
  const v = new THREE.Vector3();
  for (const l of labels) {
    if (!show) { l.el.style.display = 'none'; continue; }
    v.copy(l.pos).project(camera);
    const dist = cam.pos.distanceTo(l.pos);
    if (v.z > 1 || v.z < -1 || Math.abs(v.x) > 1.05 || Math.abs(v.y) > 1.05 || dist > 1700 || (l.el.classList.contains('free') && dist > 650)) { l.el.style.display = 'none'; continue; }
    l.el.style.display = ''; l.el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; l.el.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
    l.el.style.fontSize = clamp(1200 / dist * 12, 10, 14) + 'px';
  }
  $('info').textContent = `x ${cam.pos.x.toFixed(0)}  z ${cam.pos.z.toFixed(0)}  Höhe ${cam.pos.y.toFixed(0)} m` + (mode === 'walk' ? `  (Boden ${heightAt(cam.pos.x, cam.pos.z).toFixed(0)} m)` : '');
  requestAnimationFrame(frame);
}
$('load').style.display = 'none';
setLight('daemmerung');
const startView = (location.hash || '#dorf').slice(1);
setLight('nacht');
if (WALKS[startView]) walkTo(startView); else { setView(VIEWS[startView] ? startView : 'dorf'); }
window.__world = { getMode: () => mode, setView, walkTo, setLight, cam, heightAt, scene, camera, renderer };
requestAnimationFrame(frame);
</script>
