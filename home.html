class MirrorSurface {

  }
  update() {
    const m = this.mesh, cam = this.cam; m.updateMatrixWorld(); camera.updateMatrixWorld();
    const mp = new THREE.Vector3().setFromMatrixPosition(m.matrixWorld), cp = new THREE.Vector3().setFromMatrixPosition(camera.matrixWorld);
    const rot = new THREE.Matrix4().extractRotation(m.matrixWorld), normal = new THREE.Vector3(0, 0, 1).applyMatrix4(rot), view = new THREE.Vector3().subVectors(mp, cp);
    if (view.dot(normal) > 0) return;

    const lookv = new THREE.Vector3(0, 0, -1).applyMatrix4(rot).add(cp), target = new THREE.Vector3().subVectors(mp, lookv).reflect(normal).negate().add(mp);
    cam.position.copy(view); cam.up.set(0, 1, 0).applyMatrix4(rot).reflect(normal); cam.lookAt(target);
    cam.far = camera.far; cam.updateMatrixWorld(); cam.projectionMatrix.copy(camera.projectionMatrix);

    this.texMat.multiply(cam.projectionMatrix).multiply(cam.matrixWorldInverse).multiply(m.matrixWorld);
    const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(normal, mp.clone().addScaledVector(normal, 0.01));   // alles hinter dem Spiegel abschneiden

  }

    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const hum = AC.createOscillator(); hum.type = 'sawtooth'; hum.frequency.value = 50; const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 140; const hg = AC.createGain(); hg.gain.value = 0.025; hum.connect(lp).connect(hg).connect(master); hum.start();
    const ws = AC.createBufferSource(); ws.buffer = noiseBuf; ws.loop = true; const wl = AC.createBiquadFilter(); wl.type = 'lowpass'; wl.frequency.value = 380; const wg = AC.createGain(); wg.gain.value = 0.03; ws.connect(wl).connect(wg).connect(master); ws.start();

/* ------------------------------------------------------------------------ Hauptschleife */
let last = performance.now(), stepT = 0;
function update(dt) {

  if (started && !ended) {
    const f = (keys.has('KeyW') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0), r = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0), run = keys.has('ShiftLeft') || keys.has('ShiftRight');
    const sp = (f || r) ? (run ? 3.4 : 1.9) : 0, sn = Math.sin(player.yaw), cs = Math.cos(player.yaw);

  const d = new Date(Date.UTC(2026, 10, 7, 23, 41, 0) + time * 1000); $('stamp').textContent = 'OBERHAUSEN  ' + String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0') + ':' + String(d.getUTCSeconds()).padStart(2, '0');
