let started = false, locked = false, paused = false, ended = false, time = 0;
const R = 0.32;
function resolve(p) { for (const c of colliders) { const cx = Math.max(c.minX, Math.min(p.x, c.maxX)), cz = Math.max(c.minZ, Math.min(p.z, c.maxZ)), dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz; if (d2 < R * R) { if (d2 > 1e-8) { const d = Math.sqrt(d2); p.x += dx / d * (R - d); p.z += dz / d * (R - d); } else { const a = p.x - c.minX, b = c.maxX - p.x, e = p.z - c.minZ, f = c.maxZ - p.z, m = Math.min(a, b, e, f); if (m === a) p.x = c.minX - R; else if (m === b) p.x = c.maxX + R; else if (m === e) p.z = c.minZ - R; else p.z = c.maxZ + R; } } } }
function groundY(x, z) {
  if (x >= 0 && x <= 10 && z >= 0 && z <= 9.5) return FLOOR_Y;

/* ------------------------------------------------------------------------ Ton (rein synthetisch) */
let AC = null, master = null, noiseBuf = null;

function burst(f, q, dur, vol, type = 'bandpass') { if (!AC) return; const s = AC.createBufferSource(); s.buffer = noiseBuf; const b = AC.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; const g = AC.createGain(), t = AC.currentTime; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur * .2); g.gain.linearRampToValueAtTime(0, t + dur); s.connect(b).connect(g).connect(master); s.start(t, Math.random(), dur + .05); }

/* ------------------------------------------------------------------------ Aufgaben, Texte, Ablauf */
let subTimer = 0, subQueue = [];

function sayList(list, per = 3.2) { subQueue = list.map(t => [t, per]); subShift(); }

const tasks = { ab: false, pass: false, case: false };

function renderTasks() {
  const t = (k, txt) => `<div class="${tasks[k] ? 'done' : ''}">${tasks[k] ? '[x]' : '[ ]'} ${txt}</div>`;
  $('tasks').innerHTML = '<b>ZU ERLEDIGEN</b>' + t('ab', 'Anrufbeantworter abhören') + t('pass', 'Pässe aus der Küche holen') + t('case', 'Koffer im Schlafzimmer prüfen');
}

  }
}
const interactables = [
  { id: 'ab', pos: [4.6, 1.0], r: 1.7, label: () => tasks.ab ? 'E: Nachricht noch einmal hören' : 'E: Anrufbeantworter abhören', act() {

  { id: 'pass', pos: [7.85, 2.2], r: 1.6, label: () => tasks.pass ? '' : 'E: Pässe nehmen', act() { if (tasks.pass) return; tasks.pass = true; passports.visible = false; say(TEXT.passports, 5); renderTasks(); checkAll(); burst(2500, 2, 0.1, 0.2); } },
  { id: 'case', pos: [2.7, 8.2], r: 1.6, label: () => tasks.case ? '' : 'E: Koffer ansehen', act() { if (tasks.case) return; tasks.case = true; say(TEXT.suitcase, 5); renderTasks(); checkAll(); burst(900, 1, 0.15, 0.2); } },
  { id: 'photo', pos: [0.6, 3.1], r: 1.5, label: () => 'E: Foto ansehen', act() { say(TEXT.photo, 5.5); } },
  { id: 'crib', pos: [8.6, 8.2], r: 1.8, label: () => 'E: Wiege ansehen', act() { say(TEXT.crib, 5); } },
  { id: 'tv', pos: [2.1, 4.4], r: 1.6, label: () => 'E: Fernseher', act() { say(TEXT.tv, 4); burst(3000, 0.5, 0.4, 0.15, 'highpass'); } },
  { id: 'fridge', pos: [9.5, 3.4], r: 1.4, label: () => 'E: Kühlschrank öffnen', act() { say(TEXT.fridge, 3.5); } },
  { id: 'door', pos: [5, 9.2], r: 1.4, label: () => phase.doorOpen ? '' : 'E: Wohnungstür öffnen', act() {
      phase.doorOpen = true; doorLeaf.visible = false; colliders.splice(colliders.indexOf(doorCol), 1); say(phase.v === 'tasks' ? TEXT.doorOpenFree : TEXT.doorOpen, 4); burst(500, 1, 0.25, 0.3); } },
  { id: 'taxi', pos: [8.2, 14.2], r: 2.8, label: () => (phase.v === 'ready' && taxi.visible) ? 'E: Ins Taxi steigen' : '', act() { if (phase.v === 'ready') finish(); } },
  { id: 'kiosk', pos: [49, 9.6], r: 2.8, label: () => 'E: Kiosk ansehen', act() { say(TEXT.kiosk, 5.5); } },
  { id: 'bus', pos: [27, 13.2], r: 2.4, label: () => 'E: Fahrplan lesen', act() { say(TEXT.bus, 5.5); tone(2000, 0.05, 0.08, 'square'); } },
  { id: 'swing', pos: [10.5, 57.4], r: 2.6, label: () => 'E: Schaukel anstoßen', act() { say(TEXT.swing, 5); swingKick = 1; burst(1500, 6, 0.5, 0.12); } },
  { id: 'tower', pos: [82, 46.3], r: 3.2, label: () => 'E: Klingelschilder ansehen', act() { say(TEXT.tower, 5.5); } },
  { id: 'mailbox', pos: [3.2, 11.8], r: 1.6, label: () => 'E: Briefkasten', act() { say(TEXT.mailbox, 4.5); } }
];
let abLedBlink = 0;
function findInteractable() {
  const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw); let best = null, bd = 1e9;
  for (const it of interactables) {
    const dx = it.pos[0] - player.pos.x, dz = it.pos[1] - player.pos.z, d = Math.hypot(dx, dz);
    if (d > it.r || !it.label()) continue;
    if (d > 0.9 && (dx * fx + dz * fz) / d < 0.45) continue;

}
function mirrorEvent() {
  if (phase.mirrorDone) return; phase.mirrorDone = true;
  const t0 = performance.now();
  tone(60, 1.6, 0.35, 'sawtooth', 35); burst(200, 0.6, 1.2, 0.25, 'lowpass');
  say(TEXT.mirror[0], 2.6);
  setTimeout(() => { ent.visible = true; flickerUntil = performance.now() + 2800; say(TEXT.mirror[1], 2.6); }, 900);
  setTimeout(() => { ent.visible = false; }, 3300);
  setTimeout(() => say(TEXT.mirror[2], 4), 3700);
}
let flickerUntil = 0;
function finish() {
  if (ended) return; ended = true; document.exitPointerLock && document.exitPointerLock();
  $('fade').style.transition = 'opacity 1.6s'; $('fade').style.opacity = 1; tone(220, 1.5, 0.2, 'sine', 80);
  setTimeout(() => { $('endText').textContent = TEXT.end; $('end').style.display = 'flex'; }, 1800);
}

/* ------------------------------------------------------------------------ Eingabe */
function setPaused(p) { if (p === paused) return; paused = p; if (p) { keys.clear(); $('overlay').style.display = 'flex'; $('overlay').querySelector('.go').textContent = 'PAUSE – KLICKEN ZUM WEITERSPIELEN'; } }
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (started && e.code === 'Escape') { setPaused(true); return; }
  if (paused) return; keys.add(e.code);
  if (!started || ended) return;
  if (e.code === 'KeyE') { const it = findInteractable(); if (it) it.act(); }
  if (e.code === 'KeyL') look.enabled = !look.enabled;
  if (e.code === 'KeyK') { const hs = [200, 300, 450, 720]; look.setHeight(hs[(hs.indexOf(look.height) + 1) % hs.length]); say('Auflösung: ' + look.height + 'p', 1.5); }
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('mousemove', e => { if (!started || ended || !(locked || e.buttons & 1)) return; player.yaw -= e.movementX * 0.0022; player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch - e.movementY * 0.0022)); });

function begin() {
  initAudio(); if (AC && AC.state === 'suspended') AC.resume();
  $('overlay').style.display = 'none'; paused = false;
  if (!started) { started = true; renderTasks(); setTimeout(() => say(TEXT.start, 5), 600); setTimeout(() => say(TEXT.hintTasks, 5), 7500); }
  try { const r = renderer.domElement.requestPointerLock(); if (r && r.catch) r.catch(() => { }); } catch (e) { }
}
$('overlay').addEventListener('click', begin);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); look.resize(); });

/* ------------------------------------------------------------------------ Hauptschleife */
let last = performance.now(), stepT = 0, boundsT = -99, nextEvent = 25, towerBlink = 0;
function update(dt) {
  time += dt;
  if (subTimer > 0) { subTimer -= dt; if (subTimer <= 0) { $('sub').textContent = ''; subShift(); } }
  if (started && !ended) {
    const f = (keys.has('KeyW') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0), r = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0), run = keys.has('ShiftLeft') || keys.has('ShiftRight');
    const sp = (f || r) ? (run ? 3.4 : 1.9) : 0, sn = Math.sin(player.yaw), cs = Math.cos(player.yaw);
    let vx = -sn * f + cs * r, vz = -cs * f - sn * r; const l = Math.hypot(vx, vz) || 1;
    player.pos.x += vx / l * sp * dt; player.pos.z += vz / l * sp * dt;
    const bx = Math.max(-108, Math.min(128, player.pos.x)), bz = Math.max(-66, Math.min(106, player.pos.z));
    if ((bx !== player.pos.x || bz !== player.pos.z) && time - boundsT > 8) { boundsT = time; say(TEXT.bounds, 4); }
    player.pos.x = bx; player.pos.z = bz;
    resolve(player.pos);
    const gy = groundY(player.pos.x, player.pos.z) + 1.65; player.pos.y += (gy - player.pos.y) * Math.min(1, dt * 12);
    if (sp > 0) { player.bob += dt * (run ? 10 : 7); stepT -= dt * (run ? 3 : 1.9); if (stepT <= 0) { stepT = 1; burst(player.pos.z < 9.5 && player.pos.x > 0 && player.pos.x < 10 ? 300 : 700, 1, 0.07, 0.13, 'lowpass'); } }
    // Spiegel-Ereignis: nach dem Packen, auf dem Weg zur Tür
    if (phase.v === 'ready' && !phase.mirrorDone && player.pos.x > 4 && player.pos.x < 6 && player.pos.z > 6.9 && player.pos.z < 9.4) mirrorEvent();
    const it = findInteractable(); $('prompt').textContent = it ? it.label() : '';
  }
  // Anrufbeantworter blinkt rot
  abLed.visible = tasks.ab ? false : (Math.floor(time * 1.6) % 2 === 0);
  // Flackern in der Wohnung beim Spiegel-Ereignis
  const fl = performance.now() < flickerUntil;
  const BASE = { hall: 11, living: 15, kitchen: 18, bed: 11, bath: 9, nursery: 9 };
  for (const k in BASE) L[k].intensity = BASE[k] * (fl ? (Math.random() > 0.45 ? 1 : 0) : 1);
  L.kitchen.intensity *= (0.92 + Math.sin(time * 70) * 0.04 + (Math.random() < 0.02 ? -0.5 : 0));
  lampTVL.intensity = 8 * (0.7 + Math.random() * 0.5);
  look.u.uFlash.value = fl && Math.random() < 0.06 ? 0.12 : 0;
  // Zufallsereignisse in der Siedlung: ferner Hund, Zug, flackernde Laterne

    else if (k === 1 && AC) { const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true; const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 160; const g = AC.createGain(), t0 = AC.currentTime; g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.18, t0 + 3); g.gain.linearRampToValueAtTime(0, t0 + 7); s.connect(f).connect(g).connect(master); s.start(); s.stop(t0 + 7.2); setTimeout(() => { tone(311, 1.2, 0.04, 'sine'); tone(392, 1.2, 0.04, 'sine'); }, 2500); }
    else { const l = lampPool[Math.floor(Math.random() * 4)]; let n = 0; const iv = setInterval(() => { l.intensity = l.intensity > 0 ? 0 : 190; if (++n > 8) { clearInterval(iv); l.intensity = 190; } }, 90); }
  }
  { const px = player.pos.x, pz = player.pos.z, near = streetLamps.map(l => [Math.hypot(l.x - px, l.z - pz), l]).sort((a, b) => a[0] - b[0]); for (let i = 0; i < lampPool.length; i++) lampPool[i].position.set(near[i][1].x, 4.8, near[i][1].z); }
  swingKick = Math.max(0, swingKick - dt * 0.18); swingSeats.forEach((g, i) => { g.rotation.x = Math.sin(time * 2.1 + i) * 0.45 * swingKick; });
  towerBlink += dt;
  camera.position.set(player.pos.x, player.pos.y + Math.sin(player.bob) * 0.035, player.pos.z); camera.rotation.set(player.pitch, player.yaw, 0);
  const d = new Date(Date.UTC(2026, 10, 7, 23, 41, 0) + time * 1000); $('stamp').textContent = 'OBERHAUSEN  ' + String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0') + ':' + String(d.getUTCSeconds()).padStart(2, '0');
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  try { if (!paused) update(dt); mirror.update(); look.render(scene, camera); } catch (e) { $('err').textContent = 'Fehler im Spiel: ' + e.message; console.error(e); }
  requestAnimationFrame(frame);

await Promise.all(furnJobs);

window.__home = { ent, mirror, player, begin, camera, interactables, tasks, phase, look, say, mirrorEvent, scene, colliders };
requestAnimationFrame(frame);
